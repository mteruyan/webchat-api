<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Elegir lugar en el mapa</title>
<link rel="stylesheet" href="leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #0A2540; }
  body { display: flex; flex-direction: column; background: #fff; }
  .tope { padding: 10px 12px; background: #0A2540; color: #fff; font-size: 14px; line-height: 1.3; }
  .tope b { display: block; font-size: 15px; margin-bottom: 2px; }
  #mapa { flex: 1; min-height: 0; }
  .barra { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 12px; border-top: 1px solid #dde4ec; background: #fff; }
  button { font: inherit; font-size: 14px; border-radius: 10px; border: 1px solid #c4cfdb; background: #fff; color: #0A2540; padding: 10px 12px; cursor: pointer; }
  button.primario { background: #E8590C; border-color: #E8590C; color: #fff; font-weight: 700; flex: 1; }
  button:disabled { opacity: .45; cursor: default; }
  #aviso { width: 100%; font-size: 12.5px; color: #8a1c1c; min-height: 16px; }
</style>
</head>
<body>
<div class="tope"><b>📍 Elige el lugar exacto</b>Toca el mapa o arrastra el pin hasta donde recibirán al profesional.</div>
<div id="mapa"></div>
<div class="barra">
  <div id="aviso" role="status"></div>
  <button id="btnGps" type="button">📍 Mi ubicación</button>
  <button id="btnCancelar" type="button">Cancelar</button>
  <button id="btnOk" type="button" class="primario" disabled>✅ Confirmar lugar</button>
</div>
<script src="leaflet.js"></script>
<script>
(function () {
  // Límites de Perú (los mismos que valida el servidor): se avisa antes de enviar.
  var PERU = { latMin: -18.5, latMax: 0.5, lngMin: -81.6, lngMax: -68.4 };
  var $aviso = document.getElementById('aviso'), $ok = document.getElementById('btnOk');
  var pos = null, pin = null;

  // El mensaje sale solo hacia la página que nos incrustó (si el navegador lo informa).
  var destino = '*';
  try {
    if (location.ancestorOrigins && location.ancestorOrigins.length) destino = location.ancestorOrigins[0];
    else if (document.referrer) destino = new URL(document.referrer).origin;
  } catch (e) { destino = '*'; }
  function enviar(msg) {
    msg.tipo = 'sanitas_mapa';
    try { window.parent.postMessage(msg, destino); } catch (e) { window.parent.postMessage(msg, '*'); }
  }

  L.Icon.Default.prototype.options.imagePath = 'img/';
  var mapa = L.map('mapa', { zoomControl: true }).setView([-12.0464, -77.0428], 12);   // Lima
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
  }).addTo(mapa);

  function fueraDePeru(ll) {
    return ll.lat < PERU.latMin || ll.lat > PERU.latMax || ll.lng < PERU.lngMin || ll.lng > PERU.lngMax;
  }
  function poner(ll, centrar) {
    pos = ll;
    if (!pin) {
      pin = L.marker(ll, { draggable: true }).addTo(mapa);
      pin.on('dragend', function () { poner(pin.getLatLng(), false); });
    } else { pin.setLatLng(ll); }
    if (centrar) mapa.setView(ll, Math.max(mapa.getZoom(), 17));
    if (fueraDePeru(ll)) { $aviso.textContent = 'Ese punto está fuera de Perú. Mueve el pin.'; $ok.disabled = true; }
    else { $aviso.textContent = ''; $ok.disabled = false; }
  }
  mapa.on('click', function (e) { poner(e.latlng, false); });

  document.getElementById('btnGps').onclick = function () {
    if (!navigator.geolocation) { $aviso.textContent = 'Tu navegador no permite usar la ubicación. Toca el mapa para marcar el lugar.'; return; }
    $aviso.textContent = 'Buscando tu ubicación…';
    navigator.geolocation.getCurrentPosition(function (p) {
      $aviso.textContent = '';
      poner(L.latLng(p.coords.latitude, p.coords.longitude), true);
    }, function () {
      $aviso.textContent = 'No pude obtener tu ubicación. Toca el mapa para marcar el lugar.';
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  };
  $ok.onclick = function () {
    if (!pos || fueraDePeru(pos)) return;
    enviar({ accion: 'confirmar', lat: Math.round(pos.lat * 1e6) / 1e6, lng: Math.round(pos.lng * 1e6) / 1e6 });
  };
  document.getElementById('btnCancelar').onclick = function () { enviar({ accion: 'cancelar' }); };
})();
</script>
</body>
</html>
